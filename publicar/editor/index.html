<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15201A">
<meta name="description" content="Editor del Cerco — mapa y editor del cerco eléctrico del rancho.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/iconos/icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cerco">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="/config.js"></script>
<script src="/nube.js"></script>
</head>
<body>
<title>Editor del Cerco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: una sola pantalla — barra arriba, mapa al centro con una mira fija, y abajo un panel de pasos con botones grandes (zona del pulgar) */
:root{
  --bg:#EEF2EE; --panel:#FFFFFF; --panel2:#E6ECE6; --rule:#CBD5CC; --fg:#15201A; --muted:#55645A;
  --accent:#F2B705; --accent-fg:#1D1600; --red:#D3261B; --gate:#1F6FD1; --note:#7442D8; --ok:#1B8A3A; --warn:#B26A00;
  --shadow:0 -6px 24px rgba(10,20,14,.18);
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --panel:#1A201C; --panel2:#252D28; --rule:#35403A; --fg:#EEF2EC; --muted:#A3AFA6;
  --accent:#FFC93C; --accent-fg:#1B1503; --red:#FF6B5E; --gate:#5AAEFF; --note:#B997FF; --ok:#7BD88F; --warn:#FFB84D;
  --shadow:0 -6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --panel:#1A201C; --panel2:#252D28; --rule:#35403A; --fg:#EEF2EC; --muted:#A3AFA6;
  --accent:#FFC93C; --accent-fg:#1B1503; --red:#FF6B5E; --gate:#5AAEFF; --note:#B997FF; --ok:#7BD88F; --warn:#FFB84D;
  --shadow:0 -6px 24px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-ui);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--rule)}
.top h1{font-size:17px;margin:0;font-weight:750;white-space:nowrap;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.ttl{display:grid;min-width:0}
.save{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.save.ok{color:var(--ok)} .save.warn{color:var(--warn)}
.sp{flex:1}
.tb{height:42px;border:1px solid var(--rule);border-radius:12px;background:var(--panel2);display:inline-flex;align-items:center;gap:6px;padding:0 12px;cursor:pointer;font-weight:650;font-size:14.5px;flex:none}
.tb:disabled{opacity:.4;cursor:default}
.tb svg{width:20px;height:20px;flex:none}
.tb.icon{width:42px;padding:0;justify-content:center}
a.tb{color:inherit;text-decoration:none}
a.tb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:flex;gap:16px;overflow-x:auto;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--rule);font:650 13px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stats i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.stats .dead{color:var(--muted)}
.mapwrap{position:relative;flex:1;min-height:120px;overflow:hidden;background:#0a0d0b}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.aim{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none}
.aim svg{width:100%;height:100%;overflow:visible}
.tools2{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;display:grid;gap:8px;z-index:6}
.zb{position:relative}
.zb.add{background:var(--accent);color:var(--accent-fg);border-color:rgba(0,0,0,.35)}
.zb.add svg{width:26px;height:26px}
.zb[aria-expanded="true"]{outline:3px solid var(--accent);outline-offset:2px}
.zb .dot{position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:#FFC93C;border:2px solid #15201A}
.zb .badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;box-sizing:border-box;padding:0 6px;border-radius:99px;background:#7442D8;color:#fff;font:750 12.5px var(--f-ui);display:grid;place-items:center;border:2px solid #fff}
.zb .badge:empty{display:none}
@media (hover:hover){.zb[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#15201A;color:#fff;padding:7px 11px;border-radius:9px;font:600 14px var(--f-ui);white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:30}
  .zoom .zb[data-tip]:hover::after{left:auto;right:calc(100% + 10px)}}
.pop{position:absolute;left:calc(max(10px,env(safe-area-inset-left,0px)) + 58px);top:10px;width:min(400px,calc(100% - 136px));max-height:calc(100% - 20px);overflow:auto;box-sizing:border-box;background:var(--panel);color:var(--fg);border:1px solid var(--rule);border-radius:16px;padding:14px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:20}
.pop .ph{display:flex;align-items:center;gap:10px}
.pop .ph h2{margin:0;flex:1;font-size:18px;line-height:1.25}
.pop .ph .x{width:40px;height:40px;border-radius:10px;border:0;background:var(--panel2);display:grid;place-items:center;cursor:pointer;flex:none}
.pop .ph .x svg{width:18px;height:18px}
.pop p{margin:0;color:var(--muted);font-size:14.5px}
.pop{width:min(300px,calc(100% - 136px));padding:11px;gap:9px;border-radius:13px}
.pop .ph h2{font-size:14.5px}
.pop .ph .x{width:32px;height:32px;border-radius:8px}
.pop .ph .x svg{width:15px;height:15px}
.pop p{font-size:12.5px}
.pop .grid6{gap:7px}
.pop .card{min-height:72px;padding:9px;border-radius:12px;gap:4px}
.pop .card svg{width:22px;height:22px}
.pop .card b{font-size:13px}
.pop .card small{font-size:11px}
.pop .chips{gap:6px}
.pop .chip{font-size:12px;padding:5px 10px 5px 7px;gap:5px;border-width:1.5px}
.pop .chip svg{width:15px;height:15px}
.pop .b.sm{min-height:34px;font-size:12.5px;padding:4px 11px;border-radius:10px}
@media (max-width:520px){.pop{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;top:66px;max-height:calc(100% - 76px)}}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:grid;gap:8px}
.zb{width:46px;height:46px;border-radius:14px;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.94);color:#15201A;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.zb svg{width:22px;height:22px}
.zlvl{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;align-items:center;gap:10px;background:rgba(15,19,17,.82);color:#fff;border-radius:10px;padding:6px 10px;font:650 13px var(--f-num);font-variant-numeric:tabular-nums;pointer-events:none}
.zlvl .bar{display:flex;align-items:center;gap:6px}
.zlvl .bar i{display:block;height:6px;border:2px solid #fff;border-top:0}
.snack{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;align-items:center;gap:10px;background:#15201A;color:#fff;border-radius:14px;padding:10px 10px 10px 14px;font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.snack p{margin:0;flex:1;min-width:0}
.snack button{border:0;background:none;color:#FFD54A;font-weight:750;padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
/* panel de abajo */
.dock{background:var(--panel);border-top:1px solid var(--rule);box-shadow:var(--shadow);padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:10px;max-height:56vh;overflow:auto;position:relative;z-index:2}
.dock h2{margin:0;font-size:19px;line-height:1.25;font-weight:750;text-wrap:balance}
.dock .step{font:750 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dock p{margin:0}
.dock .lead{font-size:15.5px;color:var(--muted)}
.dhead{display:flex;align-items:flex-start;gap:12px}
.dhead .ico{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:none}
.dhead .ico svg{width:26px;height:26px}
.dhead .tt{flex:1;min-width:0;display:grid;gap:2px}
.dhead .x{width:44px;height:44px;border-radius:12px;border:0;background:var(--panel2);display:grid;place-items:center;cursor:pointer;flex:none}
.dhead .x svg{width:20px;height:20px}
.dhead .del{height:44px;border-radius:12px;border:1px solid color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);display:flex;align-items:center;gap:6px;padding:0 12px;font:700 15px var(--f-ui);cursor:pointer;flex:none}
.dhead .del svg{width:19px;height:19px}
.dhead .del:hover{background:color-mix(in srgb,var(--red) 22%,transparent)}
.fb{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;font-weight:650;font-size:15px;background:var(--panel2)}
.fb::before{content:"";width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.fb.ok{color:var(--ok)} .fb.ok::before{background:var(--ok)}
.fb.warn{color:var(--warn)} .fb.warn::before{background:var(--warn)}
.fb.bad{color:var(--red)} .fb.bad::before{background:var(--red)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:120px}
.b{min-height:52px;border-radius:14px;border:1px solid var(--rule);background:var(--panel2);font-weight:700;font-size:16px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.b svg{width:22px;height:22px;flex:none}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.b.red{background:var(--red);border-color:var(--red);color:#fff}
.b.go{background:var(--ok);border-color:var(--ok);color:#fff}
.b.ghost{background:none}
.b:disabled{opacity:.4;cursor:default}
.b.huge{min-height:60px;font-size:17px}
.dock{grid-auto-rows:max-content;overscroll-behavior:contain}   /* cada bloque mide lo que necesita; si no cabe, el panel hace scroll */
.list{display:grid;border:1px solid var(--rule);border-radius:14px;overflow:hidden;flex:none}
.li{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 14px;border:0;border-top:1px solid var(--rule);background:var(--panel);text-align:left;cursor:pointer;font-size:16px;font-weight:600}
.li:first-child{border-top:0}
.li svg{width:22px;height:22px;flex:none;color:var(--muted)}
.li span{flex:1;min-width:0}
.li small{display:block;font-weight:500;color:var(--muted);font-size:13.5px}
.li.danger{color:var(--red)} .li.danger svg{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-weight:750;font-size:14px;width:max-content;max-width:100%}
.pill.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.off{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.grid6{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--rule);background:var(--panel2);border-radius:16px;padding:12px;display:grid;gap:6px;justify-items:start;text-align:left;cursor:pointer;min-height:96px;align-content:start}
.card svg{width:30px;height:30px}
.card b{font-size:16px}
.card small{color:var(--muted);font-size:13.5px;line-height:1.3}
.dock input[type=text],.dock textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:12px;padding:12px;font:inherit;font-size:16px}
.dock textarea{min-height:84px;resize:vertical}
.q{background:var(--panel2);border-radius:14px;padding:12px 14px;font-size:16px}
.ans{font-size:14.5px;color:var(--ok);font-weight:650}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav .b{flex:0 1 auto;min-width:0}
/* menú y ventanas */
.menu{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:8px;width:min(320px,calc(100% - 16px));background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:6px;display:grid;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20}
.menu button{border:0;background:none;text-align:left;padding:13px 12px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;gap:12px;align-items:center}
.menu button svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu button:hover{background:var(--panel2)}
.menu .danger{color:var(--red)}
.menu textarea{margin:6px;min-height:90px;background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:10px;font:12px var(--f-num);padding:8px}
.modal{position:fixed;inset:0;background:rgba(5,10,7,.55);display:grid;place-items:end center;z-index:30;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{place-items:center}}
.mcard{background:var(--panel);border-radius:20px;padding:20px;width:min(460px,100%);max-height:86vh;overflow:auto;display:grid;gap:14px;box-sizing:border-box}
.mcard h2{margin:0;font-size:21px;text-wrap:balance}
.mcard p{margin:0;font-size:16px;color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--accent);width:22px;border-radius:99px}
.legend{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.legend li{display:flex;gap:12px;align-items:center;font-size:15.5px}
.legend svg{width:44px;height:26px;flex:none;background:#3a4a3f;border-radius:6px}
.illus{background:#2f3f33;border-radius:14px;height:120px;display:grid;place-items:center}
.illus svg{width:100%;height:100%}
/* computadora: panel a la derecha, letras más grandes */
@media (min-width:900px){
  body{display:grid;grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto auto minmax(0,1fr);font-size:17px}
  .top,.stats{grid-column:1/-1}
  .mapwrap{grid-column:1;grid-row:3}
  body.nodock{grid-template-columns:minmax(0,1fr)}
  .dock{grid-column:2;grid-row:3;max-height:none;border-top:0;border-left:1px solid var(--rule);box-shadow:none;align-content:start;padding:22px 22px 28px;gap:14px}
  .dock h2{font-size:22px}
  .dock .lead{font-size:16.5px}
  .top h1{font-size:20px}
  .stats{font-size:14.5px;padding-block:8px}
  .li{min-height:56px;font-size:17px}
}
.mapwrap.aiming #map{cursor:crosshair}
.mapwrap.hovering #map{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:#15201A;color:#fff;border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translate(14px,14px);max-width:60%;overflow:hidden;text-overflow:ellipsis}
.tip small{display:block;font-weight:500;opacity:.75;font-size:12.5px}
.kbd{font:600 12.5px var(--f-num);border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--panel2)}
.sec{display:grid;gap:8px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--rule);background:var(--panel);color:var(--muted);border-radius:99px;padding:7px 13px 7px 9px;font-weight:650;font-size:15px;cursor:pointer}
.chip svg{width:20px;height:20px;flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--fg)}
.chip[aria-pressed="false"]{opacity:.6}
.chip[aria-pressed="false"] svg{filter:grayscale(1)}
.sec h3{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.swl{display:grid;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.swr{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-top:1px solid var(--rule);background:var(--panel)}
.swr:first-child{border-top:0}
.swr .nm{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:4px 0;font-size:16px;font-weight:650}
.swr .nm small{display:block;font-weight:600;font-size:13.5px}
.swr .nm small.on{color:var(--ok)} .swr .nm small.off{color:var(--red)}
.b.sm{min-height:42px;font-size:15px;padding:6px 14px;flex:none;min-width:0}
/* mapa */
.w-case{fill:none;stroke:#050706;stroke-opacity:.75;stroke-linecap:round;stroke-linejoin:round}
.w{fill:none;stroke-linecap:round;stroke-linejoin:round}
.w.dead{stroke:#9aa29c;stroke-dasharray:5 5}
.w.sel{stroke:#FFC93C;stroke-opacity:.45}
.road{fill:none;stroke:#C9A15A;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:700 12.5px var(--f-ui);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.4s ease-out infinite}@keyframes pl{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.7)}}}
</style>

<header class="top">
  <a class="tb icon" id="inicio" href="/" aria-label="Volver al inicio" title="Volver al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="ttl"><h1>Cerco del rancho</h1><span class="save" id="save" role="status">Cargando…</span></div>
  <span class="sp"></span>
  <button class="tb" id="undo" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Deshacer</button>
  <button class="tb icon" id="menuBtn" type="button" aria-label="Más opciones" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button>
</header>
<div class="stats" id="stats" aria-live="polite"></div>

<main class="mapwrap" id="wrap">
  <svg id="map" aria-label="Mapa del cerco eléctrico sobre la foto del rancho">
    <g id="world">
      <image id="photo" href="rancho-cel.jpg" x="0" y="0" preserveAspectRatio="none"></image>
      <g id="g-road"></g>
      <g id="g-wire"></g>
      <g id="g-draft"></g>
    </g>
    <g id="g-sym"></g>
  </svg>
  <div class="aim" id="aim" hidden><svg viewBox="-32 -32 64 64" aria-hidden="true">

  if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (e.key === 'Escape' && popKind) { closePop(); return; }
  if (e.key === 'Escape' && modal.hidden && menu.hidden) { const x = $('dx') || $('cancel') || $('done'); if (x) x.click(); return; }
  if (e.key === 'Delete' && !typing && mode === 'select' && sel && exists(sel) && modal.hidden) { e.preventDefault(); removeThing(sel.t === 'a' ? {t: 'w', id: sel.id} : sel); return; }   // tecla Supr borra lo seleccionado (se puede deshacer)
  if (e.key === 'Enter' && !typing && mode === 'wire' && $('finish') && !$('finish').disabled) { e.preventDefault(); finishWire(); }
});

/* ---------- buscar cosas cerca ---------- */
function nearestWire(p, r, opts) {
  let best = null;
  net.wires.forEach(w => { if (opts && opts.noCable && w.kind === 'cable') return; if (isBarb(w) && ((opts && opts.noBarb) || !V('barb'))) return; if (opts && opts.exclude && opts.exclude.has(w.id)) return;
    const q = project(p, w.pts); if (q.d <= r && (!best || q.d < best.q.d)) best = {w, q}; });
  return best;
}
function nearestVertex(p, r, exclude) {
  let best = null;
  net.wires.forEach(w => { if (exclude && exclude.has(w.id)) return; w.pts.forEach(q => { const d = dist(p, q); if (d <= r && (!best || d < best.d)) best = {d, q, w}; }); });
  return best;
}
function nearestHandle(p) {
  const w = W(ctx.id); if (!w) return null; let best = null;
  w.pts.forEach((q, i) => { const d = dist(p, q); if (d <= R(26) && (!best || d < best.d)) best = {d, i}; });
  return best ? best.i : null;
}
function candidates(p) {
  const r = R(28), out = [];
  if (V('energizer')) net.energizers.forEach(e => { const d = dist(p, [e.x, e.y]); if (d <= r) out.push({t: 'e', id: e.id, d}); });
  net.parts.forEach(q => { if (!isGate2(q) || !V('gate')) return; const A = anchorPos(q.a), B = anchorPos(q.b); if (!A || !B) return; const d = project(p, [A, B]).d; if (d <= R(14)) out.push({t: 'p', id: q.id, d}); });
  net.parts.forEach(q => { if (isGate2(q) || qHidden(q) || !V(partKey(q))) return; const pos = partPos(q); const at = q.type === 'note' ? [pos[0], pos[1] - 14 * symF() / view.k] : pos; const d = dist(p, at); if (d <= r) out.push({t: 'p', id: q.id, d}); });
  if (!out.length && V('end')) autoEnds().forEach(w => { const e = endPt(w), d = dist(p, e); if (d <= R(20)) out.push({t: 'a', id: w.id, d}); });
  // los alambres siempre cuentan, aunque haya una puerta o un switch cerca; solo ceden cuando el clic cae justo encima de esa cosa
  const pen = out.length ? R(12) : 0;
  net.wires.forEach(w => { if ((w.kind === 'cable' && !cabV(w)) || (isBarb(w) && !V('barb'))) return; const q = project(p, w.kind === 'cable' ? cableArc(w) : w.pts); if (q.d <= R(18)) out.push({t: 'w', id: w.id, d: q.d + pen}); });
  return out.sort((a, b) => a.d - b.d);
}
function descendants(id) { const s = new Set([id]); let grew = true; while (grew) { grew = false; net.wires.forEach(w => { if (w.from && s.has(w.from) && !s.has(w.id)) { s.add(w.id); grew = true; } }); } return s; }
function snapSource(p, exclude) {
  let be = null; net.energizers.forEach(e => { const d = dist(p, [e.x, e.y]); if (d <= R(30) && (!be || d < be.d)) be = {d, e}; });
  if (be) return {from: be.e.id, pt: [be.e.x, be.e.y], label: be.e.name};
  const nw = nearestWire(p, R(26), {exclude, noBarb: true});
  if (nw) { let pt = [nw.q.x, nw.q.y]; nw.w.pts.forEach(q => { if (dist(q, p) < R(14)) pt = q.slice(); }); return {from: nw.w.id, pt, label: nw.w.name}; }
  return null;
}

/* ---------- la mira ---------- */
const AIM_MODES = new Set(['place', 'wire', 'cable', 'move', 'from', 'gate', 'cut']);
const CUT_GAP = 4;   // espacio vacío al cortar (unidades del mapa, ~7 m)
function aimState() {
  if (MOUSE && !hover) return {ok: true, pt: null, msg: ''};
  const p = aimWorld();
  if (mode === 'place' || mode === 'move') {
    const type = mode === 'place' ? ctx.type : ctx.t === 'e' ? 'energizer' : PT(ctx.id).type;
    if (type === 'switch' || type === 'gate' || type === 'end') {
      const nw = nearestLine(p, R(32), type === 'switch', type === 'gate');
      if (nw) return {ok: true, snap: true, pt: [nw.q.x, nw.q.y], w: nw.w.id, s: nw.q.s, msg: `Sobre «${nw.w.name}»`};
      return type === 'gate' ? {ok: true, warn: true, pt: p, msg: 'No está sobre un alambre: quedará solo como marca'} : {ok: false, pt: p, msg: 'Acerca la mira a un alambre'};
    }
    return {ok: true, pt: p, msg: type === 'energizer' ? 'Pon la mira donde está el energizador' : 'Pon la mira donde va la nota'};
  }
  if (mode === 'from') {
    const s = snapSource(p, descendants(ctx.id));
    return s ? {ok: true, snap: true, pt: s.pt, from: s.from, msg: `Le llega de «${s.label}»`} : {ok: false, pt: p, msg: 'Acerca la mira a un energizador o un alambre'};
  }
  if (mode === 'gate') {
    const nw = nearestWire(p, R(30), {noCable: true, exclude: ctx.a ? new Set() : null});
    if (!nw) return {ok: false, pt: p, msg: ctx.a ? 'Acerca el mouse al alambre del otro lado' : 'Acerca el mouse a un alambre'};
    let pt = [nw.q.x, nw.q.y], s = nw.q.s; const L = plen(nw.w.pts);
    if (s < R(18)) { pt = nw.w.pts[0].slice(); s = 0; } else if (L - s < R(18)) { pt = nw.w.pts[nw.w.pts.length - 1].slice(); s = L; }   // se pega a la punta
    if (ctx.a && ctx.a.on === nw.w.id && Math.abs(ctx.a.s - s) < R(6)) return {ok: false, pt, msg: 'Elige el alambre del otro lado de la puerta'};
    return {ok: true, snap: true, pt, w: nw.w.id, s, msg: `${ctx.a ? 'Termina en' : 'Empieza en'} «${nw.w.name}»`};
  }
  if (mode === 'cut') {
    const w = W(ctx.id); if (!w) return {ok: false, pt: p, msg: ''};
    const q = project(p, w.pts), L = plen(w.pts);
    if (q.d > R(30)) return {ok: false, pt: p, msg: `Acerca el mouse a «${w.name}»`};
    if (q.s < CUT_GAP * 1.5 || L - q.s < CUT_GAP * 1.5) return {ok: false, snap: true, pt: [q.x, q.y], msg: 'Muy cerca de la punta: corta más adentro'};
    return {ok: true, snap: true, pt: [q.x, q.y], s: q.s, msg: `Corta aquí «${w.name}»`};
  }
  if ((mode === 'wire' || mode === 'cable') && !draft) return {ok: false, pt: p, msg: ''};
  if (mode === 'wire' || mode === 'cable') {
    if (!draft.pts.length && draft.kind === 'barb') { const v = nearestVertex(p, R(16)); return v ? {ok: true, snap: true, pt: v.q.slice(), from: null, msg: `Empieza junto a «${v.w.name}»`} : {ok: true, pt: p, from: null, msg: 'Empieza aquí'}; }
    if (!draft.pts.length) {
      const s = snapSource(p);
      if (mode === 'cable') return s ? {ok: true, snap: true, pt: s.pt, from: s.from, msg: EN(s.from) ? `Sale del energizador «${s.label}»` : `Del lado de «${s.label}»`} : {ok: false, pt: p, msg: 'Acerca la mira a un alambre o a un energizador'};
      return s ? {ok: true, snap: true, pt: s.pt, from: s.from, msg: `La corriente sale de «${s.label}»`} : {ok: true, warn: true, pt: p, from: null, msg: 'Aquí no hay energizador ni alambre: quedará sin corriente'};
    }
    if (mode === 'cable') {
      const t = cableTarget(p);
      if (!t) return {ok: true, warn: true, pt: p, msg: 'Aquí no hay alambre: después dibujas el que sigue'};
      return t.bad ? {ok: false, snap: true, pt: t.pt, msg: t.msg} : {ok: true, snap: true, pt: t.pt, target: t, msg: t.msg};
    }
    const v = nearestVertex(p, R(16));
    if (v) return {ok: true, snap: true, pt: v.q.slice(), msg: `Se junta con «${v.w.name}»`};
    const nw = nearestWire(p, R(12));
    if (nw) return {ok: true, snap: true, pt: [nw.q.x, nw.q.y], msg: `Llega hasta «${nw.w.name}»`};
    const L = plen(draft.pts.concat([p]));
    return {ok: true, pt: p, msg: `Largo: ${fmt(M(L))}`};
  }
  return {ok: true, pt: p, msg: ''};
}

let docRef = null, saveTimer = 0, saving = false, saveAgain = false;
let SYNC = 0;   // fecha (savedAt) de la versión de la nube de la que sale lo que hay en este dispositivo
const CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';

function lsWrite(t) { try { localStorage.setItem(LS_KEY, JSON.stringify({net, savedAt: t || Date.now(), base: SYNC})); } catch (e) {} }
function queueSave() {
  lsWrite(); clearTimeout(saveTimer);
  if (!docRef) { setSave('Guardado en el teléfono', 'warn'); return; }
  setSave('Guardando…'); saveTimer = setTimeout(doSave, 1000);
}
async function doSave() {
  if (!docRef) return;
  if (saving) { saveAgain = true; return; }
  saving = true; setSave('Guardando…');
  const slow = setTimeout(() => setSave('Guardando… (lento)', 'warn'), 8000);
  try { const t = Date.now(); await docRef.set({net, savedAt: t}); SYNC = t; lsWrite(t); setSave('Guardado', 'ok'); }
  catch (e) { setSave(e && e.code === 'invalid_argument' ? 'Sin permiso para guardar' : 'Guardado solo en el teléfono', 'warn'); }

}

      <div class="list">${jo ? li('a-join', 'from', jm.feed ? `Pasarle la corriente a «${jo.name}»` : `Conectar con «${jo.name}»`, 'En lugar de que muera aquí, la corriente sigue') : ''}${w.kind !== 'cable' ? li('a-ext', 'extend', 'Alargar el alambre', 'Seguir dibujando desde aquí') : ''}${li('a-wire', 'wire', 'Ver el alambre', w.name)}${li('a-del', 'trash', 'Borrar este alambre', w.name, true)}</div>`);
    on('dx', close);
    on('a-ext', () => { draft = {kind: isBarb(w) ? 'barb' : 'fence', from: w.from, pts: w.pts.map(q => q.slice()), extend: w.id, base: w.pts.length}; sel = null; setMode('wire'); });
    on('a-wire', () => { sel = {t: 'w', id: w.id}; setMode('select'); });
    on('a-join', () => askJoinEnd(w.id));
    on('a-del', () => removeThing({t: 'w', id: w.id}));
    return;
  }
  const q = PT(sel.id);
  if (q.type === 'switch') {
    const grp = q.grp ? net.parts.filter(o => o.grp === q.grp) : [q];
    const alt = solve(net, q), delta = Math.abs(M(liveTotal(alt) - liveTotal(SOL)));
    H(`${head('switch', 'Switch', q.name, true)}
      <span class="pill ${q.open ? 'off' : 'on'}">${q.open ? 'Abierto: no pasa la corriente' : 'Cerrado: pasa la corriente'}</span>
      <p class="lead">${q.open ? `Está dejando sin corriente ${fmt(delta)}.` : `Si lo abres, se quedan sin corriente ${fmt(delta)}.`}${grp.length > 1 ? ` Corta ${grp.length} salidas a la vez.` : ''}</p>
      <button class="b ${q.open ? 'go' : 'red'} huge" id="tog" type="button">${IC.power}${q.open ? 'Cerrar switch (dar corriente)' : 'Abrir switch (cortar)'}</button>
      <div class="list">${li('a-move', 'move', 'Mover', q.on ? 'Ahora sobre: ' + nameOf(q.on) : '')}${li('a-name', 'rename', 'Cambiar nombre')}${li('a-del', 'trash', 'Borrar este switch', '', true)}</div>`);
    on('dx', close);
    on('tog', () => toggleSwitch(q));
    on('a-move', () => startMove('p', q.id)); on('a-name', () => setMode('rename', {t: 'p', id: q.id})); on('a-del', () => removeThing({t: 'p', id: q.id}));
    return;
  }
  if (q.type === 'end') {
    const w = W(q.on), rest = w ? M(SOL.len[w.id] - q.s) : 0;
    H(`${head('end', 'Fin de línea', 'Aquí termina la corriente', true)}
      <p class="lead">Está sobre «${esc(nameOf(q.on))}». De este punto en adelante el alambre no tiene corriente${rest > 3 ? ` (quedan ${fmt(rest)} sin corriente)` : ''}.</p>
      <div class="list">${rest > 3 ? li('a-trim', 'trash', 'Quitar el alambre que sobra', `Borra los ${fmt(rest)} que siguen después del punto`) : ''}${li('a-move', 'move', 'Mover')}${li('a-del', 'trash', 'Borrar este fin de línea', '', true)}</div>`);
    on('dx', close); on('a-move', () => startMove('p', q.id)); on('a-del', () => removeThing({t: 'p', id: q.id}));
    on('a-trim', () => trimAt(q));
    return;
  }
  if (isGate2(q)) {
    const A = anchorPos(q.a), B = anchorPos(q.b), wide = A && B ? M(dist(A, B)) : 0;
    const same = q.a.on === q.b.on;
    H(`${head('gate', 'Puerta', same ? 'Puerta en «' + nameOf(q.a.on) + '»' : 'Puerta entre dos alambres', true)}
      <p class="lead">${same ? '' : `Va de «${esc(nameOf(q.a.on))}» a «${esc(nameOf(q.b.on))}». `}Mide unos ${fmt(wide)} de ancho. Por la puerta no pasa la corriente; si la corriente brinca por arriba, pon un «Cable puente».</p>
      <div class="list">${li('a-redo', 'move', 'Volver a ponerla', 'Elegir otra vez los dos alambres')}${li('a-del', 'trash', 'Borrar esta puerta', '', true)}</div>`);
    on('dx', close); on('a-del', () => removeThing({t: 'p', id: q.id}));
    on('a-redo', () => { change(() => { net.parts = net.parts.filter(o => o !== q); }); sel = null; setMode('gate', {a: null}); snack('Haz los dos clics de nuevo', true); });
    return;
  }
  if (q.type === 'gate') {
    const pos = partPos(q);
    H(`${head('gate', 'Puerta', 'Puerta de un solo punto', true)}
      <p class="lead">Esta puerta quedó de la versión anterior y no está pegada a dos alambres. Ponla de nuevo entre los dos alambres.</p>
      <button class="b pri huge" id="regate" type="button">${IC.gate}Ponerla entre 2 alambres</button>
      <div class="list">${li('a-del', 'trash', 'Borrar esta puerta', '', true)}</div>`);
    on('dx', close); on('a-del', () => removeThing({t: 'p', id: q.id}));
    on('regate', () => { change(() => { net.parts = net.parts.filter(o => o !== q); }); sel = null; setMode('gate', {a: null}); flyTo(pos[0], pos[1], Math.max(view.k, 3)); });
    return;
  }
  if (q.type === 'gate') {
    H(`${head('gate', 'Puerta', 'Puerta', true)}
      <p class="lead">${q.on ? `Está sobre «${esc(nameOf(q.on))}». Como no tiene cable encima, de aquí en adelante no pasa la corriente.` : 'Está marcada en el mapa, pero no sobre un alambre, así que no corta nada.'}</p>
      <div class="list">${li('a-move', 'move', 'Mover')}${li('a-del', 'trash', 'Borrar esta puerta', '', true)}</div>`);
    on('dx', close); on('a-move', () => startMove('p', q.id)); on('a-del', () => removeThing({t: 'p', id: q.id}));
    return;
  }
  if (q.type === 'note' && q.by === 'claude') { const list = net.parts.filter(p => p.type === 'note' && p.by === 'claude').map(p => p.id); sel = null; setMode('ask', {list, i: Math.max(0, list.indexOf(q.id))}); flyToNote(); return; }
  if (q.type === 'note') {
    H(`${head('note', 'Nota para Claude', 'Lo que quieres que sepa', true)}
      <textarea id="nt" aria-label="Texto de la nota" placeholder="Ej. aquí el alambre sigue hasta el bebedero">${esc(q.text || '')}</textarea>
      <button class="b pri huge" id="ok" type="button">${IC.check}Guardar nota</button>
      <div class="list">${li('a-move', 'move', 'Mover')}${li('a-del', 'trash', 'Borrar esta nota', '', true)}</div>`);
    on('dx', close);
    on('ok', () => { const v = $('nt').value; if (v !== q.text) change(() => q.text = v); snack('Nota guardada'); sel = null; setMode('idle'); });
    on('a-move', () => startMove('p', q.id)); on('a-del', () => removeThing({t: 'p', id: q.id}));
    if (ctx.focus) setTimeout(() => { const t = $('nt'); if (t) t.focus(); }, 60);
  }
}

function switchGroups() { const seen = new Set(); return net.parts.filter(q => q.type === 'switch' && !(q.grp && seen.has(q.grp)) && (q.grp ? seen.add(q.grp) : true)).sort((a, b) => a.name.localeCompare(b.name, 'es')); }
function toggleSwitch(q) {
  const grp = q.grp ? net.parts.filter(o => o.grp === q.grp) : [q];
  const delta = Math.abs(M(liveTotal(solve(net, q)) - liveTotal(SOL))), nv = !q.open;
  change(() => grp.forEach(o => o.open = nv)); renderDock(); buzz();
  snack(nv ? `«${q.name}» abierto: ${fmt(delta)} sin corriente` : `«${q.name}» cerrado: regresó la corriente a ${fmt(delta)}`, true);
}

/* ---------- botones del mapa: agregar, filtros, preguntas ---------- */

    pop.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => { const k = b.dataset.f; setVis(Object.assign({}, vis, {[k]: !V(k)})); });

function updateTools() {
  const box = $('tools2'); if (!box) return;

$('tAdd').onclick = () => openPop('add');
$('tFilter').onclick = () => openPop('filter');
$('tAsk').onclick = () => { closePop(); sel = null; startAsk(); };
document.addEventListener('pointerdown', e => { if (popKind && !pop.contains(e.target) && !e.target.closest('#tools2')) closePop(); });

/* ---------- preguntas de Claude, una por una ---------- */
function startAsk() {
  const all = net.parts.filter(p => p.type === 'note' && p.by === 'claude').map(p => p.id);
  const first = all.findIndex(id => !(PT(id).answer || '').trim());
  setMode('ask', {list: all, i: Math.max(0, first)}); flyToNote();
}
function flyToNote() { const q = PT(ctx.list[ctx.i]); if (q) flyTo(q.x, q.y + 30, Math.max(view.k, 2.2)); }
function renderAsk() {
  const q = PT(ctx.list[ctx.i]); if (!q) { setMode('idle'); return; }
  const n = ctx.list.length, txt = q.text.replace(/^\?\d+\s*/, ''), ans = (q.answer || '').trim();
  H(`${head('ask', `Pregunta ${ctx.i + 1} de ${n}`, 'Pregunta de Claude', true)}
    <p class="q">${esc(txt)}</p>
    ${ans ? `<p class="ans">Tu respuesta: ${esc(ans)}</p>` : ''}
    ${ctx.write ? `<textarea id="ta" aria-label="Tu respuesta" placeholder="Explícame con tus palabras">${esc(ans === 'Sí, está bien' || ans === 'No sé' ? '' : ans)}</textarea>
      <button class="b pri huge" id="save" type="button">${IC.check}Guardar respuesta</button>`
    : `<div class="btns"><button class="b go huge" id="yes" type="button">${IC.check}Sí, está bien</button><button class="b huge" id="no" type="button">No, te explico</button></div>
      <button class="b ghost" id="dk" type="button">No sé</button>`}
    <div class="nav"><button class="b ghost" id="prev" type="button" ${ctx.i ? '' : 'disabled'}>‹ Anterior</button><button class="b ghost" id="next" type="button">${ctx.i < n - 1 ? 'Siguiente ›' : 'Terminar'}</button></div>`);
  const answer = v => { change(() => q.answer = v); buzz(); ctx.write = false; next(); };
  const next = () => { if (ctx.i < n - 1) { ctx.i++; ctx.write = false; renderDock(); render(); flyToNote(); } else { setMode('idle'); snack(pendingQs().length ? `Faltan ${pendingQs().length} preguntas` : '¡Gracias! Contestaste todas las preguntas'); } };
  on('dx', () => setMode('idle'));
  on('yes', () => answer('Sí, está bien')); on('dk', () => answer('No sé'));
  on('no', () => { ctx.write = true; renderDock(); setTimeout(() => $('ta') && $('ta').focus(), 60); });
  on('save', () => { const v = $('ta').value.trim(); if (!v) { $('ta').focus(); return; } answer(v); });
  on('prev', () => { ctx.i--; ctx.write = false; renderDock(); render(); flyToNote(); });
  on('next', next);
}

/* ---------- acciones ---------- */
function onTap(p, vtx) {
  if (mode === 'shape') {
    const w = W(ctx.id);
    if (vtx != null) { ctx.v = ctx.v === vtx ? null : vtx; render(); renderDock(); return; }
    for (let i = 1; i < w.pts.length; i++) {   // tocar un "+"
      const a = w.pts[i - 1], b = w.pts[i], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      if (dist(a, b) >= R(56) && dist(p, m) < R(22)) { change(() => { w.pts.splice(i, 0, m); fixParts(w.id); }); ctx.v = i; render(); renderDock(); return; }
    }
    ctx.v = null; render(); renderDock(); return;
  }
  if (AIM_MODES.has(mode)) {
    if (!MOUSE) { flyTo(p[0], p[1]); return; }   // en el celular: tocar mueve la mira ahí
    hover = {x: p[0] * view.k + view.tx, y: p[1] * view.k + view.ty};   // con mouse: el clic es la acción
    ({place: confirmPlace, move: confirmMove, from: confirmFrom, wire: addPoint, cable: addPoint, gate: addGateEnd, cut: confirmCut})[mode]();
    return;
  }
  if (mode === 'ask') return;
  const c = candidates(p);
  if (!c.length) { if (sel) { sel = null; setMode('idle'); } return; }
  const close = c.filter(x => x.d - c[0].d < R(10)).filter((x, i, a) => a.findIndex(y => y.id === x.id && y.t === x.t) === i).slice(0, 5);
  if (close.length > 1) { sel = null; setMode('choose', {list: close}); return; }
  sel = {t: c[0].t, id: c[0].id}; setMode('select');
}
function startAdd(k) {
  const fk = k === 'egate' ? 'gate' : k;
  if (k !== 'wire' && !V(fk)) { vis = Object.assign({}, vis, {[fk]: true}); try { localStorage.setItem('cerco-filtro', JSON.stringify(vis)); } catch (e) {} updateZoomChip(); }
  if (k === 'wire') { draft = {kind: 'fence', from: null, pts: [], base: 1}; setMode('wire'); return; }
  if (k === 'cable') { draft = {kind: 'cable', from: null, pts: []}; setMode('cable'); return; }
  if (k === 'egate') { draft = {kind: 'cable', egate: true, from: null, pts: []}; setMode('cable'); return; }
  if (k === 'barb') { draft = {kind: 'barb', from: null, pts: [], base: 1}; setMode('wire'); return; }
  if (k === 'gate') { setMode('gate', {a: null}); if (view.k < 1.6) flyTo(...aimWorld(), 2.4); return; }
  setMode('place', {type: k});
  if (view.k < 1.6) flyTo(...aimWorld(), 2);
}
function confirmPlace() {
  const a = aimState(); if (a.ok === false) { snack(a.msg); return; }
  const t = ctx.type; let item;
  if (t === 'end') item = {id: uid('f'), type: 'end', on: a.w, s: a.s};
  else if (t === 'switch') item = {id: uid('sw'), type: 'switch', on: a.w, s: a.s, name: 'Switch ' + (net.parts.filter(q => q.type === 'switch').length + 1), open: false};
  else if (t === 'gate') item = a.w ? {id: uid('g'), type: 'gate', on: a.w, s: a.s} : {id: uid('g'), type: 'gate', x: a.pt[0], y: a.pt[1]};
  else if (t === 'note') item = {id: uid('n'), type: 'note', by: 'diego', x: a.pt[0], y: a.pt[1], text: ''};
  if (t === 'energizer') { const e = {id: uid('E'), name: 'Energizador ' + (net.energizers.length + 1), x: a.pt[0], y: a.pt[1], on: true}; change(() => net.energizers.push(e)); sel = {t: 'e', id: e.id}; }
  else { change(() => net.parts.push(item)); sel = {t: 'p', id: item.id}; }
  buzz(); snack({switch: 'Switch puesto', gate: 'Puerta puesta', end: 'Fin de línea puesto', energizer: 'Energizador puesto', note: 'Escribe tu nota'}[t], true);
  setMode('select', t === 'note' ? {focus: true} : {});
}
function addGateEnd() {
  const a = aimState(); if (a.ok === false) { snack(a.msg); return; }
  if (!ctx.a) { ctx.a = {on: a.w, s: a.s}; buzz(); render(); renderDock(); return; }
  const g = {id: uid('g'), type: 'gate', a: ctx.a, b: {on: a.w, s: a.s}};
  change(() => net.parts.push(g)); buzz(); snack('Puerta puesta', true);
  sel = {t: 'p', id: g.id}; setMode('select');
}
function confirmCut() {
  const a = aimState(); if (a.ok === false) { snack(a.msg); return; }
  const w = W(ctx.id), orig = w.pts.map(q => q.slice()), s1 = a.s - CUT_GAP / 2, s2 = a.s + CUT_GAP / 2;
  const w2 = {id: uid('w'), name: w.name.replace(/ \(\d+\)$/, '') + ' (2)', kind: w.kind, pts: splitAt(orig, s2)[1], from: null};
  change(() => {
    w.pts = splitAt(orig, s1)[0];
    const move = an => { if (an.on !== w.id) return; if (an.s > s2) { an.on = w2.id; an.s = Math.max(0, an.s - s2); } else if (an.s > s1) an.s = s1; };
    net.parts.forEach(q => { if (q.on) move(q); if (isGate2(q)) { move(q.a); move(q.b); } });
    net.wires.forEach(o => { if (o.from === w.id && project(o.pts[0], orig).s > a.s) o.from = w2.id; });
    net.wires.splice(net.wires.indexOf(w) + 1, 0, w2);
  });
  buzz(); snack(isBarb(w) ? 'Cerca cortada' : 'Alambre cortado. Lo que sigue quedó sin corriente', true);
  sel = null; setMode('idle');
}
function startMove(t, id) { sel = null; setMode('move', {t, id}); const pos = t === 'e' ? [EN(id).x, EN(id).y] : partPos(PT(id)); flyTo(pos[0], pos[1], Math.max(view.k, 2)); }
function confirmMove() {
  const a = aimState(); if (a.ok === false) { snack(a.msg); return; }
  change(() => {
    if (ctx.t === 'e') { const e = EN(ctx.id); net.wires.forEach(w => { if (w.from === e.id) w.pts[0] = a.pt.slice(); }); e.x = a.pt[0]; e.y = a.pt[1]; }
    else { const q = PT(ctx.id); if (a.w) { q.on = a.w; q.s = a.s; delete q.x; delete q.y; } else { delete q.on; delete q.s; q.x = a.pt[0]; q.y = a.pt[1]; } }
  });
  buzz(); snack('Movido', true); sel = {t: ctx.t, id: ctx.id}; setMode('select');
}
function confirmFrom() {
  const a = aimState(); if (a.ok === false) { snack(a.msg); return; }
  const w = W(ctx.id);
  change(() => { w.from = a.from; w.pts[0] = a.pt.slice(); });
  buzz(); snack('Ahora le llega de ' + nameOf(a.from), true); sel = {t: 'w', id: w.id}; setMode('select');
}
// ¿a qué alambre le pasa la corriente el cable? Solo por una punta y en el mismo sentido del flujo
function cableTarget(p) {
  const src = draft && draft.from;
  const nw = nearestWire(p, R(24), {noCable: true, noBarb: true, exclude: new Set([src])});
  if (!nw) return null;
  const w = nw.w, a = w.pts[0], b = w.pts[w.pts.length - 1], dA = dist(p, a), dB = dist(p, b);
  const tip = dA <= dB ? 'start' : 'end', pt = (tip === 'start' ? a : b).slice();
  if (Math.min(dA, dB) > R(28)) return {bad: true, pt: [nw.q.x, nw.q.y], msg: `Lleva el cable a la punta de «${w.name}»`};
  if (descendants(w.id).has(src)) return {bad: true, pt, msg: `«${w.name}» le da corriente a este lado: se haría un círculo`};
  const powered = !!SOL.root[w.id];
  if (powered && tip === 'end') return {bad: true, pt, msg: `«${w.name}» ya tiene corriente y va en sentido contrario`};
  if (powered && !(draft && draft.egate) && !SOL.far[w.id]) return {id: w.id, pt, action: 'mark', msg: `Conecta con «${w.name}», que ya tiene corriente en el mismo sentido`};
  if (powered) return {id: w.id, pt, action: 'feed', msg: `${draft && draft.egate ? 'La puerta le pasa' : 'Le pasa'} la corriente a «${w.name}»`};   // la puerta blanca siempre se une sola
  return {id: w.id, pt, action: tip === 'start' ? 'feed' : 'flipfeed', msg: `Le pasa la corriente a «${w.name}»` + (tip === 'end' ? ' (le volteo el sentido)' : '')};
}
function addPoint() {
  const a = aimState(); if (a.ok === false) { snack(a.msg); return; }
  if (draft.pts.length && dist(draft.pts[draft.pts.length - 1], a.pt) < R(4)) return;   // doble clic
  if (!draft.pts.length) draft.from = a.from;
  draft.pts.push(a.pt.slice()); buzz();
  if (mode === 'cable' && draft.pts.length === 2) return finishCable(a.target);
  render(); renderDock();
}
function undoPoint() { const min = draft.extend ? draft.base : 1; if (draft.pts.length > min) draft.pts.pop(); else if (!draft.extend) draft.pts = []; render(); renderDock(); }
function cancelDraft() { const ext = draft && draft.extend; draft = null; if (ext) { sel = {t: 'w', id: ext}; setMode('select'); } else setMode('idle'); }
function finishWire() {
  if (draft.extend) {
    const w = W(draft.extend), extra = draft.pts.slice(draft.base); draft = null;

    ${row('<path d="M2 21H12M32 21H42" stroke="#FFF1C9" stroke-width="2.5"/><path d="M12 21Q22 -1 32 21" fill="none" stroke="#1a1300" stroke-width="6" stroke-linecap="round"/><path d="M12 21Q22 -1 32 21" fill="none" stroke="#FFD23F" stroke-width="3.5" stroke-linecap="round"/><circle cx="12" cy="21" r="3" fill="#FFD23F" stroke="#1a1300"/><circle cx="32" cy="21" r="3" fill="#FFD23F" stroke="#1a1300"/><path d="M20 7.5 23.5 10 20 12.5" fill="none" stroke="#FF9A3C" stroke-width="2" stroke-linecap="round"/>', 'Cable puente: pasa la corriente de un alambre a otro (la flecha dice hacia dónde)')}
    ${row('<circle cx="22" cy="13" r="10" fill="#141414" stroke="#FFF1C9" stroke-width="2"/><path d="M23.5 6 17.5 14.5 21.5 14.5 20 20 26.5 11.5 22.5 11.5Z" fill="#FFD23F"/>', 'Energizador (de donde sale la corriente)')}
    ${row('<path d="M4 13H24" stroke="#FFF1C9" stroke-width="3"/><path d="M24 13H40" stroke="#9aa29c" stroke-width="3" stroke-dasharray="4 3"/><circle cx="24" cy="13" r="4.6" fill="#0b0b0b"/>', 'Fin de línea: aquí termina la corriente. Si el alambre llega a otro, va pegado al cruce. Lo puedes poner con «Agregar algo»')}
    ${row('<rect x="10" y="3" width="24" height="16" rx="3" fill="#9B6BFF" stroke="#111"/><text x="22" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#111">?3</text>', 'Pregunta de Claude (verde cuando ya contestaste)')}

  $('mok').onclick = () => { modal.hidden = true; modal.textContent = ''; };

}
modal.addEventListener('click', e => { if (e.target === modal) { modal.hidden = true; modal.textContent = ''; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!modal.hidden) { modal.hidden = true; modal.textContent = ''; } else if (!menu.hidden) closeMenu(); } });

/* ---------- arranque ---------- */
// la puerta blanca siempre se une sola: el alambre que empieza en su punta recibe la corriente de ella
// (salvo que ya esté bien pegado a otra cosa que sí lo toca)
// regla: el que pasa la corriente es el alambre que lleva el flujo hacia ese punto.
// Si un alambre deja de tocar a quien le daba corriente (porque lo moviste), la toma de quien de verdad le llega ahí.
function isFar(w) { const e = EN(w.from); if (e) return dist(w.pts[0], [e.x, e.y]) > TOUCH_E; const pw = W(w.from); return !pw || project(w.pts[0], pw.pts).d > TOUCH_W; }
function feederAt(w) {
  const p = w.pts[0], desc = descendants(w.id);
  const e = net.energizers.find(e => dist(p, [e.x, e.y]) <= TOUCH_E); if (e) return e.id;
  let best = null;
  net.wires.forEach(o => {
    if (o === w || desc.has(o.id) || isBarb(o)) return;
    if (dist(p, o.pts[o.pts.length - 1]) <= TOUCH_W) { if (!best || best.r > 0) best = {id: o.id, r: 0}; return; }   // ahí llega su final: su flujo sigue en w
    if (o.kind === 'cable') return;
    const q = project(p, o.pts); if (q.d <= TOUCH_W && q.s > TOUCH_W && !best) best = {id: o.id, r: 1};   // pasa por ahí: w es una rama
  });
  return best ? best.id : null;
}
let REPARENT_SKIP = null;   // el alambre al que le estás moviendo el inicio: ese se pregunta, no se conecta solo
function reparentOrphans() {
  let n = 0;
  for (let round = 0; round < 3; round++) net.wires.forEach(w => {
    if (!w.from || isBarb(w) || w.id === REPARENT_SKIP || !isFar(w)) return;
    const f = feederAt(w); if (f && f !== w.from) { w.from = f; n++; }
  });
  return n;
}
function linkEgates() {
  let n = 0;
  net.wires.forEach(g => {
    if (!isEgate(g)) return; const e = g.pts[g.pts.length - 1];
    net.wires.forEach(o => {
      if (o === g || o.kind === 'cable' || isBarb(o) || o.from === g.id || dist(o.pts[0], e) > TOUCH_W) return;
      const f = o.from, fe = f && EN(f), fw = f && W(f);
      const touching = fe ? dist(o.pts[0], [fe.x, fe.y]) <= TOUCH_E : fw ? project(o.pts[0], fw.pts).d <= TOUCH_W : false;
      if (touching && f !== g.from) return;
      if (descendants(o.id).has(g.id)) return;
      o.from = g.id; o.pts[0] = e.slice(); n++;
    });
  });
  return n;
}
function renameCables() { net.wires.forEach(w => { if (w.kind === 'cable' && w.name === 'Cable sobre puerta') w.name = 'Cable puente'; }); }
function loadLocal() { try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return j && j.net && j.net.wires ? j : null; } catch (e) { return null; } }
async function boot() {
  initStatic();
  const local = loadLocal();
  if (local) net = local.net;
  renameCables(); linkEgates(); reparentOrphans();
  fit(); setMode('idle');
  window.addEventListener('resize', () => { if (needFit) { fit(); render(); } });
  let seen = false; try { seen = !!localStorage.getItem(LS_INTRO); } catch (e) {}
  if (!seen) showIntro(0);
  setSave('Conectando…');
  let db = null;
  try { db = window.claude && window.claude.use ? await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 8000))]) : null; } catch (e) { db = null; }
  if (!db) { setSave(local ? 'Guardado en el teléfono' : 'Sin conexión', 'warn'); return; }
  docRef = db.doc(DOC_PATH);
  try {
    const snap = await Promise.race([docRef.get(), new Promise((_, j) => setTimeout(() => j({code: 'timeout'}), 10000))]);
    const remote = snap.exists ? snap.data() : null;
    // La nube manda. Lo del dispositivo solo se sube si son cambios hechos sobre la versión actual de la nube;
    // si salió de otra versión (o de la red de base sin sesión), gana la nube y lo del dispositivo se guarda aparte.
    const pendiente = remote && remote.net && local && local.base && local.base === remote.savedAt && (local.savedAt || 0) > (remote.savedAt || 0);
    if (remote && remote.net && !pendiente) {
      if (local && (local.savedAt || 0) > (remote.savedAt || 0) && JSON.stringify(local.net) !== JSON.stringify(remote.net)) {
        try { localStorage.setItem('cerco-editor-respaldo', JSON.stringify(local)); } catch (e) {}
        snack('Este dispositivo tenía otra versión del cerco. Se abrió la de la nube y la otra quedó respaldada.');
      }
      SYNC = remote.savedAt || 0;
      net = JSON.parse(JSON.stringify(remote.net)); renameCables(); const fixed = linkEgates() + reparentOrphans(); lsWrite(SYNC); if (fixed) queueSave(); if (sel && !exists(sel)) sel = null; render(); renderDock(); setSave('Guardado', 'ok');
    } else if (pendiente) { SYNC = remote.savedAt; doSave(); }
    else if (local) doSave();
    else setSave('Guardado', 'ok');
  } catch (e) { setSave('Guardado solo en el teléfono', 'warn'); }
}
boot();
</script>
