<title>Editor del Cerco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app de pantalla completa — barra arriba, mapa al centro, herramientas abajo, ficha flotante sobre el mapa */
:root{
  --bg:#0f1311; --panel:#181e1b; --panel2:#212925; --rule:#2e3833; --fg:#eef2ec; --muted:#9aa69d;
  --amber:#FFC93C; --cyan:#5FE0EA; --red:#FF5147; --gate:#4DA3FF; --note:#B48CFF; --ok:#7BD88F;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.35 var(--f-ui);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--rule)}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.save{font:600 11.5px var(--f-ui);color:var(--muted);background:var(--panel2);border-radius:99px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.save.ok{color:var(--ok)} .save.warn{color:var(--amber)}
.sp{flex:1}
.ib{width:38px;height:38px;border:0;border-radius:10px;background:var(--panel2);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:disabled{opacity:.35}
.ib svg{width:20px;height:20px}
.ib:focus-visible,.tool:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.stats{display:flex;gap:14px;overflow-x:auto;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--rule);font:600 12.5px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stats i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.stats .dead{color:var(--muted)}
.mapwrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#0a0d0b}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.hint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 88%,transparent);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;font-size:13.5px;pointer-events:auto;backdrop-filter:blur(6px)}
.hint p{margin:0;flex:1 1 200px;min-width:0}
.hint .acts{display:flex;gap:6px;flex-wrap:wrap}
.hint.warn{border-color:var(--amber)}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:12px;display:grid;gap:6px}
.zoom .ib{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--panel2);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--amber);color:#1b1503;border-color:var(--amber)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{color:#ff8a82}
.btn.big{padding:11px 16px;font-size:15px}
.sheet{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;max-height:58%;overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:12px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;gap:10px}
@media (min-width:760px){.sheet{right:auto;width:380px}}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-kind{font:700 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-x{margin-left:auto;width:32px;height:32px}
.sheet input[type=text],.sheet textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:9px;padding:8px 10px;font:inherit}
.sheet textarea{min-height:64px;resize:vertical}
.sheet label{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta{font-size:13.5px;color:var(--muted);margin:0}
.meta b{color:var(--fg);font-weight:600}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font:700 12px var(--f-ui)}
.chip.on{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.chip.off{background:color-mix(in srgb,var(--red) 22%,transparent);color:#ff8a82}
.q{background:var(--panel2);border-radius:9px;padding:8px 10px;font-size:14px;margin:0}
.tools{display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--rule);padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:1 0 60px;border:0;background:none;border-radius:10px;padding:6px 2px 5px;display:grid;justify-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600}
.tool svg{width:24px;height:24px}
.tool[aria-pressed=true]{background:var(--panel2);color:var(--fg)}
.tool[aria-pressed=true] .tl{color:var(--amber)}
.menu{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:8px;width:min(300px,calc(100% - 16px));background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:8px;display:grid;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu button{border:0;background:none;text-align:left;padding:10px;border-radius:9px;cursor:pointer;font-size:14.5px}
.menu button:hover,.menu button:focus-visible{background:var(--panel2)}
.menu .danger{color:#ff8a82}
.menu textarea{width:100%;box-sizing:border-box;min-height:90px;background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:9px;font:12px var(--f-num);padding:8px}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
/* mapa */
.w-case{fill:none;stroke:#050706;stroke-opacity:.75;stroke-linecap:round;stroke-linejoin:round}
.w{fill:none;stroke-linecap:round;stroke-linejoin:round}
.w.dead{stroke:#8d958f;stroke-dasharray:5 5}
.w.sel{stroke:var(--amber);stroke-opacity:.35}
.road{fill:none;stroke:#C9A15A;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:700 12px var(--f-ui);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
.hit{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.4s ease-out infinite}@keyframes pl{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}}
</style>

<header class="top">
  <h1>Cerco del rancho</h1>
  <span class="save" id="save" role="status">Cargando…</span>
  <span class="sp"></span>
  <button class="ib" id="undo" type="button" aria-label="Deshacer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ib" id="redo" type="button" aria-label="Rehacer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="ib" id="menuBtn" type="button" aria-label="Más opciones" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
</header>
<div class="stats" id="stats" aria-live="polite"></div>

<main class="mapwrap" id="wrap">
  <svg id="map" aria-label="Mapa del cerco eléctrico sobre la foto del rancho">
    <g id="world">
      <image id="photo" href="rancho-cel.jpg" x="0" y="0" preserveAspectRatio="none"></image>
      <g id="g-road"></g>
      <g id="g-wire"></g>
      <g id="g-draft"></g>
    </g>
    <g id="g-sym"></g>
  </svg>
  <div class="hint" id="hint"><p id="hintTxt"></p><div class="acts" id="hintActs"></div></div>
  <div class="zoom">
    <button class="ib" type="button" id="zin" aria-label="Acercar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" type="button" id="zout" aria-label="Alejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button class="ib" type="button" id="zfit" aria-label="Ver todo el rancho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <section class="sheet" id="sheet" hidden aria-label="Detalle del componente"></section>
  <div class="menu" id="menu" hidden></div>
  <div class="toast" id="toast" hidden></div>
</main>

<nav class="tools" id="tools" aria-label="Herramientas"></nav>

<script>
const BASE = /*__BASE__*/null;
const ROAD = [[733,160],[407,529],[389,550],[352,524],[336,508]];
const DOC_PATH = 'cerco/red', LS_KEY = 'cerco-editor-v2';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const CIRC_COL = ['#FFF1C9', '#6FE3EE', '#B6F36B', '#FF9EDB', '#FFB36B'];
const CABLE_COL = '#FFD23F';

let net = JSON.parse(JSON.stringify(BASE));
let view = {k: 1, tx: 0, ty: 0};
let tool = 'ver', sel = null, draft = null, picking = null;
let undoSt = [], redoSt = [];
let SOL = null;

/* ---------- geometría ---------- */
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function plen(p) { let s = 0; for (let i = 1; i < p.length; i++) s += dist(p[i - 1], p[i]); return s; }
function project(q, p) {
  let best = {d: 1e9, s: 0, x: p[0][0], y: p[0][1], i: 0}, acc = 0;
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1e-9;
    let t = ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / (l * l); t = Math.max(0, Math.min(1, t));
    const x = a[0] + t * dx, y = a[1] + t * dy, d = Math.hypot(q[0] - x, q[1] - y);
    if (d < best.d) best = {d, s: acc + t * l, x, y, i};
    acc += l;
  }
  return best;
}
function pointAt(p, s) {
  let acc = 0;
  for (let i = 1; i < p.length; i++) {
    const l = dist(p[i - 1], p[i]);
    if (acc + l >= s && l > 0) { const t = (s - acc) / l; return [p[i - 1][0] + t * (p[i][0] - p[i - 1][0]), p[i - 1][1] + t * (p[i][1] - p[i - 1][1]), Math.atan2(p[i][1] - p[i - 1][1], p[i][0] - p[i - 1][0])]; }
    acc += l;
  }
  const n = p.length; return [p[n - 1][0], p[n - 1][1], n > 1 ? Math.atan2(p[n - 1][1] - p[n - 2][1], p[n - 1][0] - p[n - 2][0]) : 0];
}
function splitAt(p, s) {
  if (s <= 0) return [[], p.slice()];
  const out = [p[0]]; let acc = 0;
  for (let i = 1; i < p.length; i++) {
    const l = dist(p[i - 1], p[i]);
    if (acc + l >= s) { const q = pointAt(p, s); const a = out.concat([[q[0], q[1]]]); return [a, [[q[0], q[1]]].concat(p.slice(i))]; }
    out.push(p[i]); acc += l;
  }
  return [p.slice(), []];
}
const M = u => u * net.mpp;
const fmt = m => m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 1 : 2).replace(/\.?0+$/, '') + ' km' : Math.round(m) + ' m';
const W = id => net.wires.find(w => w.id === id);
const EN = id => net.energizers.find(e => e.id === id);
const PT = id => net.parts.find(p => p.id === id);
const uid = p => p + Math.random().toString(36).slice(2, 7);
function partPos(p) { if (p.on) { const w = W(p.on); if (w) { const q = pointAt(w.pts, Math.min(p.s, plen(w.pts))); return [q[0], q[1], q[2]]; } } return [p.x, p.y, 0]; }

/* ---------- simulación: la corriente sigue el sentido del dibujo ---------- */
function solve(net, flip) {
  const cut = {}, len = {}, reach = {}, root = {}, why = {};
  net.wires.forEach(w => { len[w.id] = plen(w.pts); cut[w.id] = len[w.id]; });
  net.parts.forEach(p => {
    if (!p.on || !(p.on in cut)) return;
    let open = p.type === 'gate' || (p.type === 'switch' && p.open);
    if (flip && p.type === 'switch' && (p.id === flip.id || (flip.grp && p.grp === flip.grp))) open = !flip.open;
    const s = Math.min(p.s, len[p.on]);
    if (open && s < cut[p.on]) { cut[p.on] = s; why[p.on] = p.id; }
  });
  const visiting = new Set();
  function rootOf(id, depth) {
    if (depth > 400) return null;
    if (EN(id)) return id;
    const w = W(id); if (!w || !w.from) return null;
    return rootOf(w.from, depth + 1);
  }
  function R(id) {
    if (id in reach) return reach[id];
    const w = W(id); if (!w) return 0;
    if (visiting.has(id)) return 0;
    visiting.add(id);
    let ok = false;
    if (w.from) {
      const e = EN(w.from);
      if (e) ok = e.on !== false;
      else {
        const pw = W(w.from);
        if (pw) { const r = R(pw.id); const a = project(w.pts[0], pw.pts).s; ok = r > 0 && (a < r - 1e-6 || r >= len[pw.id] - 1e-6); }
      }
    }
    visiting.delete(id);
    reach[id] = ok ? cut[id] : 0;
    return reach[id];
  }
  const circ = {}; net.energizers.forEach(e => circ[e.id] = {live: 0, total: 0});
  let dead = 0, orphan = 0;
  net.wires.forEach(w => { R(w.id); root[w.id] = rootOf(w.id, 0); const m = M(len[w.id]), lv = M(reach[w.id]);
    if (root[w.id] && circ[root[w.id]]) { circ[root[w.id]].total += m; circ[root[w.id]].live += lv; } else orphan += m;
    dead += m - lv; });
  return {cut, len, reach, root, why, circ, dead, orphan};
}
function liveTotal(s) { return Object.values(s.reach).reduce((a, b) => a + b, 0); }
function circColor(rootId) { const i = net.energizers.findIndex(e => e.id === rootId); return i < 0 ? '#8d958f' : CIRC_COL[i % CIRC_COL.length]; }

/* ---------- dibujo ---------- */
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const ptsStr = p => p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
const NSS = {'vector-effect': 'non-scaling-stroke'};
const gWire = $('g-wire'), gSym = $('g-sym'), gDraft = $('g-draft'), svg = $('map'), world = $('world');

function initStatic() {
  const [Wd, Hd] = net.size; const ph = $('photo'); ph.setAttribute('width', Wd); ph.setAttribute('height', Hd);
  el('polyline', Object.assign({points: ptsStr(ROAD), class: 'road', 'stroke-width': 7}, NSS), $('g-road'));
}
function render() {
  SOL = solve(net);
  gWire.textContent = '';
  const selW = sel && sel.t === 'w' ? sel.id : null;
  if (selW && W(selW)) el('polyline', Object.assign({points: ptsStr(W(selW).pts), class: 'w sel', 'stroke-width': 16}, NSS), gWire);
  // casings
  net.wires.forEach(w => el('polyline', Object.assign({points: ptsStr(w.pts), class: 'w-case', 'stroke-width': w.kind === 'perimeter' ? 6.5 : w.kind === 'cable' ? 5.5 : 5}, NSS), gWire));
  net.wires.forEach(w => {
    const r = SOL.reach[w.id], L = SOL.len[w.id], col = w.kind === 'cable' ? CABLE_COL : circColor(SOL.root[w.id]);
    const sw = w.kind === 'perimeter' ? 3.6 : w.kind === 'cable' ? 3.2 : 2.6;
    if (r >= L - 1e-6) el('polyline', Object.assign({points: ptsStr(w.pts), class: 'w', stroke: col, 'stroke-width': sw}, NSS), gWire);
    else {
      const [a, b] = splitAt(w.pts, r);
      if (a.length > 1 && r > 0) el('polyline', Object.assign({points: ptsStr(a), class: 'w', stroke: col, 'stroke-width': sw}, NSS), gWire);
      if (b.length > 1) el('polyline', Object.assign({points: ptsStr(b), class: 'w dead', 'stroke-width': sw}, NSS), gWire);
    }
  });
  renderDraft(); renderSyms(); renderStats(); renderUndo();
}
function renderDraft() {
  gDraft.textContent = '';
  if (!draft || !draft.pts.length) return;
  const col = draft.kind === 'cable' ? CABLE_COL : '#FFC93C';
  if (draft.pts.length > 1) el('polyline', Object.assign({points: ptsStr(draft.pts), fill: 'none', stroke: col, 'stroke-width': 3, 'stroke-dasharray': '6 4', 'stroke-linecap': 'round'}, NSS), gDraft);
}
const symF = () => Math.max(0.5, Math.min(1, view.k / 1.6));
function S(x, y, parent, extra) { return el('g', Object.assign({transform: `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${(symF() / view.k).toFixed(4)})`}, extra || {}), parent); }
function renderSyms() {
  gSym.textContent = '';
  const g0 = el('g', {transform: `matrix(${view.k} 0 0 ${view.k} ${view.tx} ${view.ty})`}, gSym); symRoot = g0; symK = view.k;
  const k = view.k;
  // viewport en coordenadas del mapa
  const r = svg.getBoundingClientRect(), vx0 = -view.tx / k, vy0 = -view.ty / k, vx1 = (r.width - view.tx) / k, vy1 = (r.height - view.ty) / k;
  const inV = (x, y) => x > vx0 - 20 && x < vx1 + 20 && y > vy0 - 20 && y < vy1 + 20;
  // flechas de flujo
  const step = 95 / k;
  net.wires.forEach(w => {
    if (w.kind === 'cable') return;
    const L = SOL.len[w.id], live = SOL.reach[w.id];
    for (let s = Math.min(step * 0.5, L / 2); s < L; s += step) {
      const q = pointAt(w.pts, s); if (!inV(q[0], q[1])) continue;
      const g = S(q[0], q[1], g0); g.setAttribute('transform', g.getAttribute('transform') + ` rotate(${(q[2] * 180 / Math.PI).toFixed(1)})`);
      el('path', {d: 'M-4 -4.5 1.5 0 -4 4.5', fill: 'none', stroke: s < live ? '#FF9A3C' : '#8d958f', 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, g);
    }
  });
  // fines de línea
  net.wires.forEach(w => {
    const e = w.pts[w.pts.length - 1]; if (!inV(e[0], e[1])) return;
    const cont = net.wires.some(o => o !== w && o.from === w.id && dist(o.pts[0], e) < 2.5) || net.wires.some(o => o !== w && o.kind !== 'cable' && project(e, o.pts).d < 1.5);
    if (cont) return;
    const g = S(e[0], e[1], g0); el('circle', {r: 4.6, fill: '#0b0b0b', stroke: '#fff', 'stroke-width': 1.4}, g);
  });
  // puertas de los cables
  net.wires.forEach(w => {
    if (w.kind !== 'cable') return;
    const m = w.gate || pointAt(w.pts, SOL.len[w.id] / 2); if (!inV(m[0], m[1])) return;
    const ang = pointAt(w.pts, SOL.len[w.id] / 2)[2] * 180 / Math.PI;
    const g = S(m[0], m[1], g0); const gg = el('g', {transform: `rotate(${ang.toFixed(1)})`}, g);
    el('rect', {x: -7, y: -3, width: 14, height: 6, rx: 2, fill: 'var(--gate)', stroke: '#fff', 'stroke-width': 1.1}, gg);
    el('path', {d: 'M-6 -3 Q0 -12 6 -3', fill: 'none', stroke: CABLE_COL, 'stroke-width': 2.4, 'stroke-linecap': 'round'}, gg);
  });
  // componentes
  net.parts.forEach(p => {
    const [x, y, ang] = partPos(p); if (!inV(x, y)) return;
    const isSel = sel && sel.t === 'p' && sel.id === p.id;
    const g = S(x, y, g0, {class: 'hit'});
    if (isSel) el('circle', {r: 17, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 2.5}, g);
    if (p.type === 'switch') {
      const gg = el('g', {transform: `rotate(${(ang * 180 / Math.PI).toFixed(1)})`}, g);

  const w = {id: uid('w'), name: kind === 'cable' ? 'Cable sobre puerta' : 'Alambre ' + n, kind, pts: draft.pts.map(q => [q[0], q[1]]), from: draft.from};
  draft = null;
  change(() => net.wires.push(w));
  if (kind === 'cable') {
    // seguir con el alambre que sale del otro lado de la puerta
    tool = 'alambre'; tb.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === 'alambre' ? 'true' : 'false'));
    draft = {kind: 'fence', from: w.id, pts: [w.pts[w.pts.length - 1].slice()], extend: null};
    updateDraftHint(); render(); toast('Cable puesto. Ahora dibuja el alambre que sigue');
    return;
  }
  setTool('ver'); sel = {t: 'w', id: w.id}; render(); renderSheet(); toast('Alambre agregado');
}
function extendWire(id) {
  const w = W(id); setTool('alambre');
  draft = {kind: 'fence', from: w.from, pts: w.pts.map(q => q.slice()), extend: id, base: w.pts.length};
  focusOn(w.pts[w.pts.length - 1][0], w.pts[w.pts.length - 1][1]); updateDraftHint(); render();
}

/* elegir de dónde le llega la corriente */
function startPick(id) {
  picking = id; sel = {t: 'w', id}; render();
  setHint('Toca el energizador o el alambre de donde le llega la corriente a «' + W(id).name + '».', [['Cancelar', () => { picking = null; setHint(); }]], true);
}
function pickParent(p) {
  const id = picking, w = W(id);
  const s = snapStart(p);
  if (!s) { toast('Toca un energizador o un alambre'); return; }
  if (s.from === id) { toast('No puede venir de sí mismo'); return; }
  let cur = s.from, guard = 0; while (cur && !EN(cur) && guard++ < 500) { if (cur === id) { toast('Ese alambre recibe la corriente de este; se haría un círculo'); return; } cur = W(cur) && W(cur).from; }
  picking = null;
  change(() => { w.from = s.from; w.pts[0] = s.pt.slice(); });
  setHint(); render(); renderSheet(); toast('Ahora viene de ' + s.label);
}
function reattach(id) {
  const w = W(id); if (!w) return;
  const p = w.pts[0]; const e = net.energizers.find(e => dist(p, [e.x, e.y]) < 20 / view.k);
  if (e) { w.from = e.id; w.pts[0] = [e.x, e.y]; return; }
  const nw = nearestWire(p, 16 / view.k, {exclude: new Set([id])});
  if (nw) { w.from = nw.w.id; w.pts[0] = [nw.q.x, nw.q.y]; }
}
function reverseWire(id) {
  change(() => {
    const w = W(id), L = plen(w.pts);
    w.pts.reverse();
    net.parts.forEach(q => { if (q.on === id) q.s = Math.max(0, L - q.s); });
    const p = w.pts[0]; const e = net.energizers.find(e => dist(p, [e.x, e.y]) < 3);
    if (e) w.from = e.id;
    else { const nw = nearestWire(p, 3, {exclude: new Set([id])}); w.from = nw ? nw.w.id : null; }
  });
  renderSheet(); toast('Sentido invertido');
}

/* ---------- ficha del componente ---------- */
const sheet = $('sheet');
function downstream(id) { // metros que dependen de un alambre (él incluido)
  let m = 0; const stack = [id], seen = new Set();
  while (stack.length) { const c = stack.pop(); if (seen.has(c)) continue; seen.add(c); const w = W(c); if (w) m += plen(w.pts); net.wires.forEach(o => { if (o.from === c) stack.push(o.id); }); }
  return M(m);
}
function renderSheet(focus) {
  validateSel();
  if (!sel) { sheet.hidden = true; sheet.textContent = ''; return; }
  sheet.hidden = false; sheet.textContent = '';
  const H = (kind, name, onName) => {
    const h = document.createElement('div'); h.className = 'sh-head';
    h.innerHTML = `<span class="sh-kind">${kind}</span>`;
    const x = document.createElement('button'); x.className = 'ib sh-x'; x.type = 'button'; x.setAttribute('aria-label', 'Cerrar'); x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    x.onclick = () => { sel = null; renderSheet(); render(); }; h.appendChild(x); sheet.appendChild(h);
    if (onName) { const lb = document.createElement('label'); lb.textContent = 'Nombre'; const i = document.createElement('input'); i.type = 'text'; i.id = 'sh-name'; i.value = name; i.onchange = () => change(() => onName(i.value.trim() || name)); lb.appendChild(i); sheet.appendChild(lb); }
  };
  const P = html => { const p = document.createElement('p'); p.className = 'meta'; p.innerHTML = html; sheet.appendChild(p); return p; };
  const Row = btns => { const r = document.createElement('div'); r.className = 'row'; btns.forEach(([label, fn, cls]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (cls ? ' ' + cls : ''); b.textContent = label; b.onclick = fn; r.appendChild(b); }); sheet.appendChild(r); return r; };

  if (sel.t === 'w') {
    const w = W(sel.id), L = SOL.len[w.id], r = SOL.reach[w.id];
    const st = r >= L - 1e-6 ? '<span class="chip on">Con corriente</span>' : r <= 0 ? '<span class="chip off">Sin corriente</span>' : `<span class="chip off">Cortado a los ${fmt(M(r))}</span>`;
    H(w.kind === 'cable' ? 'Cable sobre puerta' : w.kind === 'perimeter' ? 'Alambre del perímetro' : 'Alambre', w.name, v => w.name = v);
    P(`${st} &nbsp;<b>${fmt(M(L))}</b>`);
    let why = '';
    if (SOL.why[w.id]) { const q = PT(SOL.why[w.id]); why = q.type === 'gate' ? 'Una puerta sin cable corta la corriente.' : `El switch «${esc(q.name)}» está abierto.`; }
    else if (!w.from) why = 'No está conectado: toca «Cambiar» para decir de dónde le llega la corriente.';
    else if (r <= 0) why = 'Lo de antes ya viene sin corriente.';
    P(`Viene de: <b>${esc(nameOf(w.from))}</b>` + (why ? `<br>${why}` : ''));
    const dm = downstream(w.id); if (dm > M(L) + 1) P(`Depende de él (con lo que sigue): <b>${fmt(dm)}</b>`);
    P('Arrastra los puntos blancos para moverlos. El amarillo es donde empieza.');
    Row([['Cambiar de dónde viene', () => startPick(w.id)], ['Invertir sentido', () => reverseWire(w.id)]]);
    Row([['Seguir dibujando', () => extendWire(w.id)], ['Borrar', () => removeThing({t: 'w', id: w.id}), 'danger']]);
  } else if (sel.t === 'e') {
    const e = EN(sel.id), c = SOL.circ[e.id];
    H('Energizador', e.name, v => e.name = v);
    P(`${e.on !== false ? '<span class="chip on">Prendido</span>' : '<span class="chip off">Apagado</span>'} &nbsp;Alimenta <b>${fmt(c.live)}</b>${c.live < c.total - 1 ? ' de ' + fmt(c.total) : ''}`);
    P('Arrástralo para moverlo.');
    Row([[e.on !== false ? 'Apagar' : 'Prender', () => change(() => e.on = e.on === false), e.on !== false ? '' : 'pri'], ['Borrar', () => removeThing({t: 'e', id: e.id}), 'danger']]);
  } else {
    const q = PT(sel.id);
    if (q.type === 'switch') {
      const grp = q.grp ? net.parts.filter(o => o.grp === q.grp) : [q];
      H('Switch', q.name, v => grp.forEach(o => o.name = v));
      const alt = solve(net, q);
      P(`${q.open ? '<span class="chip off">Abierto: corta</span>' : '<span class="chip on">Cerrado: pasa</span>'} &nbsp;` + (q.open ? `Está cortando <b>${fmt(Math.max(0, M(liveTotal(alt) - liveTotal(SOL))))}</b>` : `Si lo abres corta <b>${fmt(Math.max(0, M(liveTotal(SOL) - liveTotal(alt))))}</b>`));
      if (grp.length > 1) P(`Es el mismo switch para ${grp.length} salidas; se abren y cierran juntas.`);
      P(q.on ? `Está sobre «${esc(nameOf(q.on))}». Arrástralo para moverlo sobre el alambre.` : 'No está sobre un alambre.');
      Row([[q.open ? 'Cerrar switch' : 'Abrir switch', () => { const nv = !q.open; change(() => grp.forEach(o => o.open = nv)); renderSheet(); }, q.open ? 'pri big' : 'red big'], ['Borrar', () => removeThing({t: 'p', id: q.id}), 'danger']]);
    } else if (q.type === 'gate') {
      H('Puerta');
      P(q.on ? `Está sobre «${esc(nameOf(q.on))}». Sin cable encima, la corriente no pasa de aquí en adelante.` : 'Marca de puerta (no está pegada a un alambre, no corta nada).');
      Row([['Borrar', () => removeThing({t: 'p', id: q.id}), 'danger']]);
    } else if (q.type === 'note') {
      if (q.by === 'claude') {
        H('Duda de Claude');
        const t = document.createElement('p'); t.className = 'q'; t.textContent = q.text; sheet.appendChild(t);
        const lb = document.createElement('label'); lb.textContent = 'Tu respuesta'; const ta = document.createElement('textarea'); ta.id = 'sh-answer'; ta.value = q.answer || ''; ta.placeholder = 'Ej. sí está bien / no, este switch solo corta el camino';
        ta.onchange = () => { change(() => q.answer = ta.value); toast('Respuesta guardada'); }; lb.appendChild(ta); sheet.appendChild(lb);
        Row([['Guardar respuesta', () => { if (ta.value !== (q.answer || '')) change(() => q.answer = ta.value); toast('Respuesta guardada'); }, 'pri']]);
      } else {
        H('Nota para Claude');
        const lb = document.createElement('label'); lb.textContent = 'Qué quieres que sepa'; const ta = document.createElement('textarea'); ta.id = 'sh-note'; ta.value = q.text || ''; ta.placeholder = 'Ej. aquí el alambre sigue hasta el bebedero';
        ta.onchange = () => change(() => q.text = ta.value); lb.appendChild(ta); sheet.appendChild(lb);
        Row([['Guardar', () => { if (ta.value !== q.text) change(() => q.text = ta.value); toast('Nota guardada'); }, 'pri'], ['Borrar', () => removeThing({t: 'p', id: q.id}), 'danger']]);
        if (focus) setTimeout(() => ta.focus(), 50);
      }
    }
  }
}

/* ---------- menú ---------- */
const menu = $('menu');
let photoOn = true, notesOn = true, resetArm = false;
function openMenu() {
  menu.hidden = false; $('menuBtn').setAttribute('aria-expanded', 'true'); menu.textContent = '';
  const B = (label, fn, cls) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (cls) b.className = cls; b.onclick = fn; menu.appendChild(b); return b; };
  B(photoOn ? 'Ocultar la foto' : 'Mostrar la foto', () => { photoOn = !photoOn; $('photo').style.opacity = photoOn ? 1 : 0.15; closeMenu(); });
  B('Ver todo el rancho', () => { fit(); closeMenu(); });
  B('Copiar todo para Claude', async () => {
    const txt = JSON.stringify(net);
    try { await navigator.clipboard.writeText(txt); toast('Copiado: pégalo en el chat'); closeMenu(); }
    catch (e) { const ta = document.createElement('textarea'); ta.readOnly = true; ta.id = 'copy-out'; ta.value = txt; menu.appendChild(ta); ta.focus(); ta.select(); }
  });
  B(resetArm ? 'Toca otra vez para volver a la versión de Claude' : 'Volver a la versión de Claude', () => {
    if (!resetArm) { resetArm = true; openMenu(); return; }
    resetArm = false; change(() => { net = JSON.parse(JSON.stringify(BASE)); }); sel = null; renderSheet(); render(); closeMenu(); toast('Volviste a la versión de Claude (puedes deshacer)');
  }, 'danger');
}
function closeMenu() { menu.hidden = true; resetArm = false; $('menuBtn').setAttribute('aria-expanded', 'false'); }
$('menuBtn').onclick = () => menu.hidden ? openMenu() : closeMenu();
document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && e.target.closest('#menuBtn') == null) closeMenu(); });

/* ---------- arranque ---------- */
function loadLocal() { try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return j && j.net && j.net.wires ? j : null; } catch (e) { return null; } }
async function boot() {
  initStatic();
  const local = loadLocal();
  if (local) net = local.net;
  fit(); render(); setTool('ver');
  setSave('Conectando…');
  let db = null;
  try { db = window.claude && window.claude.use ? await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 8000))]) : null; } catch (e) { db = null; }
  if (!db) { setSave(local ? 'Guardado en este teléfono' : 'Sin conexión: se guarda en este teléfono', 'warn'); return; }
  docRef = db.doc(DOC_PATH);
  try {
    const snap = await Promise.race([docRef.get(), new Promise((_, j) => setTimeout(() => j({code: 'timeout'}), 10000))]);
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.net && (!local || (remote.savedAt || 0) >= (local.savedAt || 0) - 2000)) {
      net = JSON.parse(JSON.stringify(remote.net)); savedAt = remote.savedAt || 0; lsWrite(); validateSel(); render(); renderSheet(); setSave('Guardado', 'ok');
    } else if (local) { doSave(); }
    else setSave('Versión de Claude', 'ok');
  } catch (e) { setSave('No se pudo leer lo guardado; usa este teléfono', 'warn'); }
}
boot();
</script>
